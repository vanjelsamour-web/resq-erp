name: Build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'api/**'
      - '*.mjs'
      - 'scripts/**'
      - 'prisma/**'
      - 'Dockerfile'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig*.json'
      - 'vite.config.*'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      DATABASE_URL: postgresql://resq:resq@localhost:5432/resq
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Normalize Prisma schema formatting
        run: node scripts/format-prisma-schema.mjs
      - name: Commit normalized schema if changed
        run: |
          if ! git diff --quiet -- prisma/schema.prisma; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add prisma/schema.prisma
            git commit -m "Normalize Prisma schema formatting"
            git push
          fi
      - name: Validate backend syntax
        run: |
          node --check server.mjs
          node --check server-preload.mjs
          node --check server-enhancements.mjs
          node --check invoice-create-enhancements.mjs
          node --check patient-import-enhancements.mjs
          node --check employee-enhancements.mjs
          node --check ocr-enhancements.mjs
      - name: Validate Prisma schema
        run: npx prisma validate
      - name: Build application
        run: npm run build
      - name: Build production Docker image
        run: docker build --pull -t resq-erp:ci .
