name: Build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'api/**'
      - '*.mjs'
      - 'prisma/**'
      - 'Dockerfile'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig*.json'
      - 'vite.config.*'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Validate backend syntax
        run: |
          node --check server.mjs
          node --check server-preload.mjs
          node --check server-enhancements.mjs
          node --check invoice-create-enhancements.mjs
          node --check patient-import-enhancements.mjs
          node --check employee-enhancements.mjs
          node --check ocr-enhancements.mjs
      - name: Validate Prisma schema
        run: npx prisma validate
      - name: Build application
        run: npm run build
